name: Montar dados, testar e gerar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar banco de materiais
        run: python dados/montar_banco.py
      - name: Validar dados
        run: python dados/validar_dados.py
      - name: Gerar entidade Room a partir do JSON
        run: python dados/gerar_entidade.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
         - name: Aceitar licenças do Android SDK
           run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes do motor e APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Renomear APK
        run: |
          mkdir -p dist
          nome="injecao-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${nome}"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: banco-de-materiais
          path: |
            app/src/main/assets/materiais.json
            dados/saida/materiais.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dados/saida/materiais.csv
            app/src/main/assets/materiais.json
          generate_release_notes: true
